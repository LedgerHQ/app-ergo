name: Code style check

on: [push, pull_request]

# Needed for reusable workflows
permissions:
  contents: read

jobs:
  job_lint:
    name: Check linting using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_lint.yml@v1
    with:
      source: './src'
      extensions: 'h,c'
