name: "CodeQL"
on:
  # temporary disable this workflow as it seems to be failing
  # on LedgerHQ/app-ergo repo due to specific repo settings.
  # See https://github.com/LedgerHQ/app-ergo/actions/runs/14265601766/job/39986602333
  workflow_dispatch:
  push:
    branches: ["main","develop"]
  pull_request:
    branches: ["main", "develop"]
    # Excluded path: add the paths you want to ignore instead of deleting the workflow
    paths-ignore:
      - '.github/workflows/*.yml'
      - 'tests/*'

# Needed for reusable workflows
permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_codeql_checks.yml@v1
    secrets: inherit
